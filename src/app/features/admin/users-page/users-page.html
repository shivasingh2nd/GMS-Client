<div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <p class="gms-page-kicker">Administration</p>
    <p class="mt-1 max-w-xl text-sm text-[var(--gms-muted)]">
      Create users who can manage only their own GMS data. Only one admin exists.
    </p>
  </div>
  <p-button label="Add user" icon="pi pi-user-plus" (onClick)="openCreate()" />
</div>

<div class="gms-table-wrap">
  @if (loadError()) {
    <div class="gms-panel p-4">
      <app-query-state
        [error]="true"
        errorTitle="Failed to load users"
        [errorDetail]="usersQuery.error()?.message || ''"
        (retry)="retryLoad()"
      />
    </div>
  } @else {
  <p-table
    [value]="rows()"
    dataKey="id"
    [loading]="loading()"
    [paginator]="rows().length > 10"
    [rows]="10"
    styleClass="p-datatable-sm gms-datatable"
  >
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th style="width: 9rem" class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td class="font-semibold">{{ row.name }}</td>
        <td>{{ row.email }}</td>
        <td>
          <p-tag [value]="row.role" [severity]="row.role === 'admin' ? 'info' : 'secondary'" />
        </td>
        <td>
          <p-tag
            [value]="row.isActive === false ? 'Inactive' : 'Active'"
            [severity]="row.isActive === false ? 'warn' : 'success'"
          />
        </td>
        <td class="text-center">
          @if (row.role !== 'admin' && !isSelf(row)) {
            <p-button
              [label]="row.isActive === false ? 'Activate' : 'Deactivate'"
              severity="secondary"
              [text]="true"
              (onClick)="confirmToggle(row)"
            />
          } @else {
            <span class="text-xs text-[var(--gms-muted)]">—</span>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <div class="gms-empty">
            <i class="pi pi-users"></i>
            <p class="font-medium text-[var(--gms-ink)]">No users yet</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  }
</div>

<p-dialog
  header="Add user"
  [modal]="true"
  [style]="{ width: 'min(34rem, 94vw)' }"
  [draggable]="false"
  styleClass="gms-dialog"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
>
  <form class="gms-dialog-body" [formGroup]="form" (ngSubmit)="save()">
    <label class="block">
      <span class="gms-field-label">Name *</span>
      <input pInputText class="w-full" formControlName="name" gmsUppercase />
    </label>
    <label class="block">
      <span class="gms-field-label">Email *</span>
      <input pInputText class="w-full" type="email" formControlName="email" />
    </label>
    <label class="block">
      <span class="gms-field-label">Password *</span>
      <p-password
        formControlName="password"
        [feedback]="true"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </label>
    <div class="gms-dialog-actions">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="dialogVisible.set(false)"
      />
      <p-button type="submit" label="Create" icon="pi pi-check" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
